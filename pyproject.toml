[project]
name = "chatbot"
version = "0.1.0"
description = "AI chatbot over scraped DarGlobal projects and Wasalt listings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langfuse>=4.7,<5",
    "litellm>=1.110.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
scrape = [
    "playwright>=1.65.2",
]
